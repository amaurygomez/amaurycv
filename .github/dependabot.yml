# One grouped pull request per ecosystem per month keeps the inbox quiet; the
# "Dependabot auto-merge" workflow merges everything except majors once CI is green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Skip releases younger than a week: most broken or compromised versions are pulled by then.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
