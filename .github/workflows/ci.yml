name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck, lint and unit tests
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the dev server in the background
        # On CI `astro dev` stays attached instead of daemonizing, so the test global setup
        # must not start it; it only waits for this one (E2E_EXTERNAL_SERVER).
        run: |
          (npx astro dev --host 127.0.0.1 > astro-dev.log 2>&1 &)
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:4321 > /dev/null && exit 0
            sleep 1
          done
          echo "dev server did not start"; cat astro-dev.log; exit 1
        env:
          # Cloudflare's always-pass test key; the specs stub the widget script itself.
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # Only the DOM-driven suites run here. The AG World suites (desktop, mobile) drive a Pixi/WebGL
      # scene that software rendering on GPU-less runners cannot keep within the test timeouts;
      # they stay in the local `npm run test:e2e`.
      - run: npx playwright test --project=home --project=cv-desktop --project=cv-mobile
        env:
          E2E_EXTERNAL_SERVER: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results/
            astro-dev.log
          retention-days: 7
